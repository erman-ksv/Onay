name: Admin route layout browser QA

on:
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "artifacts/mockup-sandbox/**"
      - "lib/db/**"
      - "scripts/admin-layout-browser-qa.py"
      - "scripts/admin-audit-client.test.mjs"
      - "scripts/admin-orders-client.test.mjs"
      - "scripts/admin-monitoring-client.test.mjs"
      - "scripts/admin-directory-client.test.mjs"
      - "scripts/admin-statistics-client.test.mjs"
      - "scripts/admin-offer-timeout-client.test.mjs"
      - ".github/workflows/admin-layout-qa.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "tsconfig*.json"
  push:
    branches:
      - main
    paths:
      - "artifacts/api-server/**"
      - "artifacts/mockup-sandbox/**"
      - "lib/db/**"
      - "scripts/admin-layout-browser-qa.py"
      - "scripts/admin-audit-client.test.mjs"
      - "scripts/admin-orders-client.test.mjs"
      - "scripts/admin-monitoring-client.test.mjs"
      - "scripts/admin-directory-client.test.mjs"
      - "scripts/admin-statistics-client.test.mjs"
      - "scripts/admin-offer-timeout-client.test.mjs"
      - ".github/workflows/admin-layout-qa.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-layout-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    name: Real admin route layout browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tezjet_admin_layout_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tezjet_admin_layout_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tezjet_admin_layout_qa
      TEZJET_STORAGE_ADAPTER: postgres
      NODE_ENV: development
      ADMIN_PHONE: "+998900000001"
      SESSION_SECRET: tezjet-admin-layout-qa-session-secret-at-least-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Admin audit client contract regressions
        run: node --experimental-transform-types --test-reporter=tap scripts/admin-audit-client.test.mjs
      - name: Admin orders client regressions
        run: node --experimental-transform-types --test-reporter=tap scripts/admin-orders-client.test.mjs
      - name: Admin monitoring client regressions
        run: node --experimental-transform-types --test-reporter=tap scripts/admin-monitoring-client.test.mjs
      - name: Admin directory client regressions
        run: node --experimental-transform-types --test-reporter=tap scripts/admin-directory-client.test.mjs
      - name: Admin statistics client regressions
        run: node --experimental-transform-types --test-reporter=tap scripts/admin-statistics-client.test.mjs
      - name: Admin offer timeout client regressions
        run: node --experimental-transform-types --test-reporter=tap scripts/admin-offer-timeout-client.test.mjs
      - name: Typecheck
        run: pnpm run typecheck

      - name: Provision PostgreSQL schema
        run: pnpm --filter @workspace/db run migrate

      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Build frontend
        env:
          NODE_ENV: production
          PORT: "4173"
          BASE_PATH: /
        run: pnpm --filter @workspace/mockup-sandbox run build

      - name: Install pinned browser tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Start API
        working-directory: artifacts/api-server
        env:
          NODE_ENV: development
          PORT: "5000"
          TEZJET_SERVE_ADMIN_UI: "true"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/admin-layout-qa"
          setsid node --enable-source-maps ./dist/index.mjs > "$GITHUB_WORKSPACE/artifacts/admin-layout-qa/api.log" 2>&1 &
          echo "$!" > "$GITHUB_WORKSPACE/artifacts/admin-layout-qa/api.pid"

      - name: Start frontend development server
        env:
          NODE_ENV: development
          PORT: "4173"
          BASE_PATH: /
          API_PROXY_TARGET: http://127.0.0.1:5000
        run: |
          setsid pnpm --filter @workspace/mockup-sandbox run dev --host 127.0.0.1 --strictPort > artifacts/admin-layout-qa/frontend.log 2>&1 &
          echo "$!" > artifacts/admin-layout-qa/frontend.pid

      - name: Wait for API, admin frontend, and API proxy
        run: |
          python - <<'PY' 2>&1 | tee artifacts/admin-layout-qa/readiness.log
          import json
          import time
          import urllib.request

          deadline = time.monotonic() + 45
          checks = (
              ("API", "http://127.0.0.1:5000/api/healthz", True),
              ("Admin frontend", "http://127.0.0.1:4173/admin", False),
              ("Built admin served by API", "http://127.0.0.1:5000/admin", False),
              ("Frontend API proxy", "http://127.0.0.1:4173/api/healthz", True),
          )
          for label, url, health in checks:
              last_error = "No response"
              while time.monotonic() < deadline:
                  try:
                      with urllib.request.urlopen(url, timeout=2) as response:
                          body = response.read()
                          if response.status != 200:
                              raise RuntimeError(f"HTTP {response.status}")
                          if health and json.loads(body).get("status") != "ok":
                              raise RuntimeError("Unexpected health response")
                          if not health and b"<html" not in body.lower():
                              raise RuntimeError("Expected frontend HTML")
                      print(f"{label} ready: {url}", flush=True)
                      break
                  except Exception as error:
                      last_error = str(error)
                      time.sleep(0.5)
              else:
                  raise SystemExit(f"{label} did not become ready: {last_error}")
          PY

      - name: Run admin route layout browser QA
        run: |
          python scripts/admin-layout-browser-qa.py \
            --base-url http://127.0.0.1:5000 \
            --api-url http://127.0.0.1:5000 \
            --output-dir artifacts/admin-layout-qa \
            2>&1 | tee artifacts/admin-layout-qa/browser-qa.log

      - name: Stop saved server processes
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import signal

          for name in ("frontend", "api"):
              pid_file = Path("artifacts/admin-layout-qa") / f"{name}.pid"
              if not pid_file.exists():
                  continue
              value = pid_file.read_text().strip()
              if not value.isdigit() or int(value) <= 1:
                  print(f"Ignoring invalid {name} PID")
                  continue
              pid = int(value)
              try:
                  if os.getpgid(pid) != pid:
                      print(f"Ignoring {name} PID without its own process group")
                      continue
                  os.killpg(pid, signal.SIGTERM)
                  print(f"Stopped {name} process group {pid}")
              except ProcessLookupError:
                  pass
          PY

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-layout-qa
          path: artifacts/admin-layout-qa
          if-no-files-found: warn
          retention-days: 14


