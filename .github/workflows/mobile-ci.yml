name: TezJet Mobile CI

on:
  pull_request:
    paths:
      - "mobile/tezjet-app/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches:
      - "main"
      - "feature/tezjet-unified-mobile-expo"
    paths:
      - "mobile/tezjet-app/**"
      - ".github/workflows/mobile-ci.yml"

  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build Android debug APK for an on-demand phone preview"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.TEZJET_API_URL }}
    defaults:
      run:
        working-directory: mobile/tezjet-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mobile dependencies
        run: pnpm install
      - name: Typecheck
        run: pnpm typecheck
      - name: Offer lifecycle and API error regressions
        run: pnpm test
      - name: Export Android and iOS bundles
        run: pnpm exec expo export --platform android --platform ios
      - name: Set up Java for Android
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Android native project
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Embed JavaScript in the debug preview
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'android/app/build.gradle';
          const source = fs.readFileSync(file, 'utf8');
          if (!source.includes('react {')) throw new Error('React Gradle configuration not found');
          fs.writeFileSync(file, source.replace('react {', 'react {\n    debuggableVariants = []'));
          NODE
      - name: Assemble Android debug APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk
        run: cd android && ./gradlew assembleDebug
      - name: Upload Android debug APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk
        uses: actions/upload-artifact@v4
        with:
          name: tezjet-android-debug-apk
          path: mobile/tezjet-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
