name: Onay Mobile CI

on:
  pull_request:
    paths:
      - "mobile/onay-app/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches:
      - "main"
      - "feature/onay-unified-mobile-expo"
      # Existing development branch remains supported during the naming transition.
      - "feature/tezjet-unified-mobile-expo"
    paths:
      - "mobile/onay-app/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.ONAY_API_URL || vars.TEZJET_API_URL }}
    defaults:
      run:
        working-directory: mobile/onay-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mobile dependencies
        run: pnpm install
      - name: Typecheck
        run: pnpm typecheck
      - name: Verify resolved Onay application identity
        run: |
          pnpm exec expo config --type public --json > onay-public-config.json
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('onay-public-config.json', 'utf8'));
          assert.equal(config.name, 'Onay');
          assert.equal(config.slug, 'onay');
          assert.equal(config.scheme, 'onay');
          assert.equal(config.android.package, 'uz.onay.app');
          assert.equal(config.ios.bundleIdentifier, 'uz.onay.app');
          NODE
      - name: Offer lifecycle and API error regressions
        run: pnpm test
      - name: Export Android and iOS bundles
        run: pnpm exec expo export --platform android --platform ios
      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Android native project
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Embed JavaScript in the debug preview
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'android/app/build.gradle';
          const source = fs.readFileSync(file, 'utf8');
          if (!source.includes('react {')) throw new Error('React Gradle configuration not found');
          fs.writeFileSync(file, source.replace('react {', 'react {\n    debuggableVariants = []'));
          NODE
      - name: Assemble Android debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Verify built APK package and application label
        run: |
          sdk_path="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt_path="$(find "$sdk_path/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt_path"
          "$aapt_path" dump badging android/app/build/outputs/apk/debug/app-debug.apk > onay-apk-badging.txt
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const badging = fs.readFileSync('onay-apk-badging.txt', 'utf8');
          assert.match(badging, /^package: name='uz\.onay\.app'/m);
          assert.match(badging, /^application-label:'Onay'/m);
          NODE
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: onay-android-debug-apk
          path: mobile/onay-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
