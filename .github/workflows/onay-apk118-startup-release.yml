name: Onay APK119 compiled resources and Android acceptance (reuse original Gradle APK)
on:
  pull_request:
    paths:
      - ".github/workflows/onay-apk118-startup-release.yml"
      - "mobile/tezjet-app/**"
      - "scripts/onay-apk119-icon-android-qa.py"
      - "scripts/onay-apk119-resources-qa.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: onay-apk119-one-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-apk119:
    name: Build APK119 on original source SHA only
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 110 && github.event.pull_request.head.sha == 'e61c32b6ec09fd73cb0f49e71211020a6ce1c1e9'
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ""
      ONAY_DEMO_PREVIEW: "true"
    defaults:
      run:
        working-directory: mobile/tezjet-app
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mobile dependencies
        run: pnpm install
      - name: Record exact build source, version and identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const cp=require('node:child_process');
          const sourceSha=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const config=JSON.parse(fs.readFileSync('app.json','utf8')).expo;
          if (sourceSha!==process.env.EXPECTED_SHA) throw Error('PR source SHA mismatch');
          if (config.android.versionCode!==119 || config.android.package!=='uz.tezjet.app') throw Error('APK119 identity mismatch');
          const receipt={sourceSha,sourceBranch:(process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME),runId:process.env.GITHUB_RUN_ID,applicationId:config.android.package,versionCode:119,displayName:config.name,artifactType:'Android debug preview',embeddedJavaScript:true,offlineDemoPreview:true};
          fs.writeFileSync('build-provenance.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt));
          NODE
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      - name: TypeScript
        run: pnpm typecheck
      - name: Validate native QA scripts before Gradle
        run: python3 -m py_compile ../../scripts/onay-apk118-startup-android-qa.py ../../scripts/onay-apk119-icon-android-qa.py ../../scripts/onay-apk119-resources-qa.py ../../scripts/onay-build-sha-android-qa.py
      - name: Mobile regressions
        run: pnpm test
      - name: Verify dynamic provenance reaches Expo configuration
        run: |
          pnpm exec expo config --json > /tmp/onay-apk119-expo.json
          node <<'NODE'
          const fs=require('node:fs');
          const config=JSON.parse(fs.readFileSync('/tmp/onay-apk119-expo.json','utf8'));
          const receipt=JSON.parse(fs.readFileSync('build-provenance.json','utf8'));
          if(config.extra?.onayBuild?.commit!==receipt.sourceSha) throw Error('Embedded Expo source SHA differs from build provenance');
          if(config.android?.versionCode!==receipt.versionCode || config.android.package!==receipt.applicationId) throw Error('Expo Android identity mismatch');
          if(!config.plugins.some(p=>Array.isArray(p) && p[0]==='expo-splash-screen' && p[1].backgroundColor==='#0a1d15' && p[1].imageWidth===160)) throw Error('Native branded splash config missing');
          if(config.icon!=='./assets/onay-launcher-icon.png'||config.android.adaptiveIcon.foregroundImage!=='./assets/onay-adaptive-foreground.png'||config.android.adaptiveIcon.backgroundColor!=='#ffffff')throw Error('Launcher/adaptive config mismatch');
          console.log('Expo/receipt SHA parity verified:', receipt.sourceSha);
          NODE
      - name: Export Android and iOS JS bundles
        run: pnpm exec expo export --clear --platform android --platform ios
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prebuild native Android once
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Inspect actual Android launcher resources
        run: |
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -Rqi '#ffffff' android/app/src/main/res/values/
          grep -Rq 'ic_launcher_foreground' android/app/src/main/res/mipmap-anydpi-v26
      - name: Embed Hermes bundle in standalone debug APK
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path='android/app/build.gradle';
          const original=fs.readFileSync(path,'utf8');
          if(!original.includes('react {')) throw Error('Gradle React config missing');
          fs.writeFileSync(path,original.replace('react {','react {\n    debuggableVariants = []'));
          NODE
      - name: Build exactly one APK119
        run: cd android && ./gradlew assembleDebug
      - name: Copy built APK and create diagnostic checksum before checking resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, shutil
          from pathlib import Path
          source=Path('android/app/build/outputs/apk/debug/app-debug.apk')
          assert source.is_file(), 'Gradle output APK missing'
          dest=Path('Onay-offline-demo-APK119.apk')
          shutil.copyfile(source,dest)
          Path('apk119-sha256.txt').write_text(hashlib.sha256(dest.read_bytes()).hexdigest()+'  '+dest.name+'\\n')
          print('Preserved completed Gradle APK and SHA256 before any QA assertions.')
          PY
      - name: Inspect actual compiled Android adaptive resources and Hermes
        shell: bash
        run: |
          set -euo pipefail
          python3 ../../scripts/onay-apk119-resources-qa.py --apk Onay-offline-demo-APK119.apk --output ../../artifacts/apk119-resource-diagnostic
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          apk=Path('Onay-offline-demo-APK119.apk')
          receipt=json.loads(Path('build-provenance.json').read_text())
          assert receipt['versionCode']==119 and receipt['offlineDemoPreview']
          assert len(receipt['sourceSha'])==40 and receipt['applicationId']=='uz.tezjet.app'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==Path('apk119-sha256.txt').read_text().split()[0]
          print('APK119 source SHA:',receipt['sourceSha'])
          print('APK119 SHA256:',hashlib.sha256(apk.read_bytes()).hexdigest())
          PY
      - name: Preserve diagnostic built APK and aapt2 evidence even after failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onay-apk119-diagnostic
          path: |
            mobile/tezjet-app/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/tezjet-app/Onay-offline-demo-APK119.apk
            mobile/tezjet-app/build-provenance.json
            mobile/tezjet-app/apk119-sha256.txt
            artifacts/apk119-resource-diagnostic/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish validated APK119 with provenance and checksum
        uses: actions/upload-artifact@v4
        with:
          name: onay-android-demo-apk-119
          path: |
            mobile/tezjet-app/Onay-offline-demo-APK119.apk
            mobile/tezjet-app/build-provenance.json
            mobile/tezjet-app/apk119-sha256.txt
            artifacts/apk119-resource-diagnostic/apk119-resource-verification.json
          if-no-files-found: error

  android-acceptance:
    name: Verify saved APK119, Android QA and native screenshots without rebuilding
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 110
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Download published APK118 baseline
        uses: actions/download-artifact@v4
        with:
          name: onay-android-demo-apk-118
          run-id: 42472262883
          repository: erman-ksv/Onay
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk118
      - name: Reuse preserved APK119 diagnostic artifact from completed Gradle, no rebuild
        uses: actions/download-artifact@v4
        with:
          name: onay-apk119-diagnostic
          run-id: 42486987509
          repository: erman-ksv/Onay
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: diagnostic
      - name: Stage exact original APK119 and provenance without resigning
        run: |
          mkdir -p apk119
          cp diagnostic/mobile/tezjet-app/Onay-offline-demo-APK119.apk apk119/
          cp diagnostic/mobile/tezjet-app/build-provenance.json apk119/
          cp diagnostic/mobile/tezjet-app/apk119-sha256.txt apk119/
          cmp diagnostic/mobile/tezjet-app/android/app/build/outputs/apk/debug/app-debug.apk apk119/Onay-offline-demo-APK119.apk
          python3 scripts/onay-apk119-resources-qa.py --apk apk119/Onay-offline-demo-APK119.apk --output artifacts/apk119-startup-native
      - name: Verify source receipt, APK checksum and signer continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/onay-apk118-startup-android-qa.py scripts/onay-apk119-resources-qa.py scripts/onay-build-sha-android-qa.py
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          old=Path('apk118/Onay-offline-demo-APK118.apk')
          new=Path('apk119/Onay-offline-demo-APK119.apk')
          assert old.is_file() and new.is_file()
          a=json.loads(Path('apk118/build-provenance.json').read_text())
          b=json.loads(Path('apk119/build-provenance.json').read_text())
          assert (a['versionCode'],b['versionCode'])==(118,119)
          assert a['sourceSha']=='516e73a553e65291b95142c7ea80b1259d4e1603'
          assert b['sourceSha']=='e61c32b6ec09fd73cb0f49e71211020a6ce1c1e9'
          assert a['applicationId']==b['applicationId']=='uz.tezjet.app'
          assert a['offlineDemoPreview'] and b['offlineDemoPreview']
          sha=hashlib.sha256(new.read_bytes()).hexdigest()
          assert Path('apk119/apk119-sha256.txt').read_text().split()[0]==sha
          with zipfile.ZipFile(new) as z:
              assert z.read('assets/index.android.bundle').startswith(bytes.fromhex('c61fbc03'))
          print('Source SHA',b['sourceSha'])
          print('APK119 SHA256',sha)
          PY
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$signer" verify --print-certs apk118/Onay-offline-demo-APK118.apk | grep 'certificate SHA-256 digest' >/tmp/onay-apk118-cert
          "$signer" verify --print-certs apk119/Onay-offline-demo-APK119.apk | grep 'certificate SHA-256 digest' >/tmp/onay-apk119-cert
          diff -u /tmp/onay-apk118-cert /tmp/onay-apk119-cert
      - name: Install SDK emulator, headless libraries and video decoder
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --install "emulator"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libpulse0 ffmpeg
          test -x "$sdk_root/emulator/qemu/linux-x86_64/qemu-system-x86_64"
          missing="$(ldd "$sdk_root/emulator/qemu/linux-x86_64/qemu-system-x86_64" | grep 'not found' || true)"
          test -z "$missing" || { echo "$missing"; exit 1; }
          "$sdk_root/emulator/emulator" -version
      - name: Verify KVM permission and emulator acceleration
        shell: bash
        run: |
          set -euo pipefail
          stat -c '%n %a %U %G' /dev/kvm
          if command -v setfacl >/dev/null 2>&1; then
            sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          else
            sudo chown "$(id -u):$(stat -c '%g' /dev/kvm)" /dev/kvm
            sudo chmod u+rw /dev/kvm
          fi
          python3 - <<'PY'
          import os
          fd=os.open('/dev/kvm',os.O_RDWR|os.O_CLOEXEC);print('KVM usable',fd);os.close(fd)
          PY
          "$ANDROID_HOME/emulator/emulator" -accel-check | tee /tmp/onay-apk119-accel
          grep -Eiq 'KVM.*(installed and usable|is usable|is enabled)' /tmp/onay-apk119-accel
      - name: Real Android 12+ startup MP4 and installed provenance SHA comparison
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/onay-apk118-startup-android-qa.py --old-apk apk118/Onay-offline-demo-APK118.apk --new-apk apk119/Onay-offline-demo-APK119.apk --old-version 118 --new-version 119 --output artifacts/apk119-startup-native && python3 scripts/onay-build-sha-android-qa.py --provenance apk119/build-provenance.json --version-code 119 --output artifacts/apk119-startup-native && python3 scripts/onay-apk119-icon-android-qa.py --version-code 119 --output artifacts/apk119-startup-native
      - name: Publish native Android screenshots XML and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onay-apk119-startup-android-qa
          path: artifacts/apk119-startup-native/
          if-no-files-found: warn

  publish-direct-apk:
    name: Publish verified direct APK119 (no ZIP)
    needs: android-acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: onay-apk119-diagnostic
          run-id: 42486987509
          repository: erman-ksv/Onay
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: diagnostic
      - name: Stage unchanged, Android-accepted APK119 for direct release
        run: |
          mkdir -p final
          cp diagnostic/mobile/tezjet-app/Onay-offline-demo-APK119.apk final/
          cp diagnostic/mobile/tezjet-app/build-provenance.json final/
          cp diagnostic/mobile/tezjet-app/apk119-sha256.txt final/
      - name: Publish only if source receipt matches completed Android acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=json.loads(Path('final/build-provenance.json').read_text())
          apk=Path('final/Onay-offline-demo-APK119.apk')
          assert r['sourceSha']=='e61c32b6ec09fd73cb0f49e71211020a6ce1c1e9'
          assert r['applicationId']=='uz.tezjet.app' and r['versionCode']==119
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==Path('final/apk119-sha256.txt').read_text().split()[0]
          Path('release-notes.md').write_text('Onay APK119 — Android offline demo, debug preview (not production).\nSource: '+r['sourceSha']+'\nPackage uz.tezjet.app / versionCode 119.\nWhite padded adaptive icon, dark localized startup. See same-run Android emulator screenshot/video evidence. Samsung physical phone testing is not claimed. No SMS/VPS/merge.\n')
          PY
          gh release create onay-demo-apk119 final/Onay-offline-demo-APK119.apk final/apk119-sha256.txt --repo erman-ksv/Onay --target e61c32b6ec09fd73cb0f49e71211020a6ce1c1e9 --prerelease --latest=false --title 'Onay APK119 - icon and startup demo' --notes-file release-notes.md
