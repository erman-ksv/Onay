name: Onay final passenger details and driver overview APK116
on:
  pull_request:
    paths:
      - ".github/workflows/onay-final-apk116.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-mobile:
    if: github.event.pull_request.head.sha == '5421afb1f3caad8f86c9f9612f6b9c79af176f3b'
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.TEZJET_API_URL }}
      ONAY_DEMO_PREVIEW: ${{ ((github.event_name == 'workflow_dispatch' && inputs.build_apk && inputs.demo_preview) || (github.event_name == 'pull_request' && github.event.pull_request.number == 110)) && 'true' || 'false' }}
    defaults:
      run:
        working-directory: mobile/tezjet-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keep offline preview independent of a configured server
        if: env.ONAY_DEMO_PREVIEW == 'true'
        run: echo 'EXPO_PUBLIC_API_URL=' >> "$GITHUB_ENV"
      - name: Install mobile dependencies
        run: pnpm install
      - name: Record checked-out source identity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid checked-out SHA');
          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' && sha !== process.env.GITHUB_SHA) throw new Error('Manual APK checkout differs from requested SHA');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
          const branch = process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME;
          const receipt = { sourceSha: sha, sourceBranch: branch, runId: process.env.GITHUB_RUN_ID, applicationId: config.android.package, versionCode: config.android.versionCode, displayName: config.name, artifactType: 'Android debug preview', embeddedJavaScript: true, offlineDemoPreview: process.env.ONAY_DEMO_PREVIEW === 'true' };
          fs.writeFileSync('build-provenance.json', JSON.stringify(receipt, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, `ONAY_BUILD_SHA=${sha}\nONAY_BUILD_BRANCH=${branch}\n`);
          console.log(JSON.stringify(receipt));
          NODE
      - name: Typecheck
        run: pnpm typecheck
      - name: Offer lifecycle and API error regressions
        run: pnpm test
      - name: Export Android and iOS bundles
        run: pnpm exec expo export --clear --platform android --platform ios
      - name: Set up Java for Android
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 110
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Android native project
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 110
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Embed JavaScript in the debug preview
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 110
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'android/app/build.gradle';
          const source = fs.readFileSync(file, 'utf8');
          if (!source.includes('react {')) throw new Error('React Gradle configuration not found');
          fs.writeFileSync(file, source.replace('react {', 'react {\n    debuggableVariants = []'));
          NODE
      - name: Assemble Android debug APK
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 110
        run: cd android && ./gradlew assembleDebug
      - name: Prepare distinctly named APK for diagnostics
        id: apk-meta
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 110
        run: |
          version_code="$(node -p "require('./app.json').expo.android.versionCode")"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          if [ "$ONAY_DEMO_PREVIEW" = "true" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "Onay-offline-demo-APK${version_code}.apk"
          fi
      - name: Verify final artifact matches the checked-out source
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 110
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          data=json.loads(Path("build-provenance.json").read_text())
          name=f"Onay-offline-demo-APK{data['versionCode']}.apk" if data['offlineDemoPreview'] else "android/app/build/outputs/apk/debug/app-debug.apk"
          path=Path(name)
          assert path.is_file(),name
          with zipfile.ZipFile(path) as z:
              bundle=z.read("assets/index.android.bundle")
              assert bundle.startswith(bytes.fromhex("c61fbc03")), "Hermes bundle missing from APK"
              assert b"onay-profile-language-row" in bundle, "Passenger language not in native asset"
              assert b"onay-driver-language" in bundle, "Driver language not in native asset"
              assert b"onay-profile-build-identity" in bundle, "Build identity UI missing"
          assert data['applicationId'] == 'uz.tezjet.app'
          assert data['sourceSha'] == __import__('os').environ['ONAY_BUILD_SHA']
          print(f"Verified APK identity: {name}, SHA={data['sourceSha']}, versionCode={data['versionCode']}")
          PY
      - name: Upload Android debug APK
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 110
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ONAY_DEMO_PREVIEW == 'true' && format('onay-android-demo-apk-{0}', steps.apk-meta.outputs.version_code) || 'tezjet-android-debug-apk' }}
          path: |
            ${{ env.ONAY_DEMO_PREVIEW == 'true' && 'mobile/tezjet-app/Onay-offline-demo-APK*.apk' || 'mobile/tezjet-app/android/app/build/outputs/apk/debug/app-debug.apk' }}
            mobile/tezjet-app/build-provenance.json
          if-no-files-found: error

  android-native-acceptance:
    name: APK115 to APK116 on Android - both new screens
    if: github.event.pull_request.head.sha == '5421afb1f3caad8f86c9f9612f6b9c79af176f3b'
    needs: verify-mobile
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Download original published APK115
        uses: actions/download-artifact@v4
        with:
          name: onay-android-demo-apk-115
          repository: erman-ksv/Onay
          run-id: 42406229478
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk115
      - name: Download this run's single final APK116
        uses: actions/download-artifact@v4
        with:
          name: onay-android-demo-apk-116
          path: apk116
      - name: Verify both APK receipts, embedded JavaScript and certificate continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/onay-driver-mode-chats-android-qa.py
          python3 - <<'PY'
          import json, zipfile, hashlib
          from pathlib import Path
          a=Path("apk115/Onay-offline-demo-APK115.apk")
          b=Path("apk116/Onay-offline-demo-APK116.apk")
          assert a.is_file() and b.is_file(), "Published and newly-built APK both required"
          old=json.loads(Path("apk115/build-provenance.json").read_text())
          new=json.loads(Path("apk116/build-provenance.json").read_text())
          assert old["versionCode"] == 115 and new["versionCode"] == 116
          assert new["sourceSha"] == "${{ github.event.pull_request.head.sha }}"
          assert old["applicationId"]==new["applicationId"]=="uz.tezjet.app"
          assert new["offlineDemoPreview"] and old["offlineDemoPreview"]
          with zipfile.ZipFile(b) as z:
              script=z.read("assets/index.android.bundle")
              assert script.startswith(bytes.fromhex("c61fbc03"))
              for marker in (b"onay-personal-details-screen",b"onay-profile-personal-email",
                             b"onay-driver-mode-overview",b"onay-driver-mode-retry"):
                  assert marker in script, marker
          print("APK116 SHA256",hashlib.sha256(b.read_bytes()).hexdigest())
          print("Manifest receipt",new)
          PY
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$signer" verify --print-certs apk115/Onay-offline-demo-APK115.apk | grep 'certificate SHA-256 digest' >/tmp/apk115cert
          "$signer" verify --print-certs apk116/Onay-offline-demo-APK116.apk | grep 'certificate SHA-256 digest' >/tmp/apk116cert
          diff -u /tmp/apk115cert /tmp/apk116cert
      - name: Install Android SDK emulator and required headless libraries before KVM checks
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$sdk_root" --install "emulator"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libpulse0
          test -x "$sdk_root/emulator/emulator"
          test -x "$sdk_root/emulator/qemu/linux-x86_64/qemu-system-x86_64"
          missing="$(ldd "$sdk_root/emulator/qemu/linux-x86_64/qemu-system-x86_64" | grep 'not found' || true)"
          test -z "$missing" || { echo "$missing"; exit 1; }
          "$sdk_root/emulator/emulator" -version
      - name: Verify runner ACL, KVM O_RDWR and emulator hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          id
          groups
          stat -c '%n %a %U %G' /dev/kvm
          if command -v setfacl >/dev/null 2>&1; then
            sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          else
            sudo chown "$(id -u):$(stat -c '%g' /dev/kvm)" /dev/kvm
            sudo chmod u+rw /dev/kvm
          fi
          python3 - <<'PY'
          import os
          fd=os.open("/dev/kvm",os.O_RDWR|os.O_CLOEXEC)
          print("KVM O_RDWR verified",fd)
          os.close(fd)
          PY
          "$ANDROID_HOME/emulator/emulator" -accel-check | tee /tmp/onay-accel-check
          grep -Eiq 'KVM.*(installed and usable|is usable|is enabled)' /tmp/onay-accel-check
      - name: Install APK115 then upgrade APK116, capture actual Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: false
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/onay-driver-mode-chats-android-qa.py --old-apk apk115/Onay-offline-demo-APK115.apk --old-version-code 115 --new-apk apk116/Onay-offline-demo-APK116.apk --version-code 116 --output artifacts/apk116-native
      - name: Publish native screenshots and ADB verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onay-apk116-personal-driver-android-qa
          path: artifacts/apk116-native/
          if-no-files-found: warn
